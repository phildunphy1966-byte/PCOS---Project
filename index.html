<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#39243F" />
    <meta name="description" content="PCOS Unlocked — understand your body, question the myths, and find your way forward." />
    <meta property="og:title" content="PCOS Unlocked" />
    <meta property="og:description" content="PCOS Unlocked — understand your body, question the myths, and find your way forward." />
    <title>PCOS Unlocked</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("pcos-theme");
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = saved === "dark" || saved === "light" ? saved : prefersDark ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
