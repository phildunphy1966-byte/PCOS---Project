<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Learning pathways</title><desc id="desc">Shared learning branches into a female learning path and a male ally path, then returns to shared exploration and support.</desc>
