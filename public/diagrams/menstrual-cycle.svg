<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Menstrual cycle phases</title><desc id="desc">A flexible four-part cycle explainer: menstruation, follicular phase, ovulation and luteal phase. Cycle length varies.</desc>
<rect width="900" height="520" rx="28" fill="#FAF7F2"/>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#242126"><circle cx="450" cy="260" r="165" fill="none" stroke="#EAE3F0" stroke-width="70"/><path d="M450 95 A165 165 0 0 1 615 260" fill="none" stroke="#E98978" stroke-width="65"/><path d="M615 260 A165 165 0 0 1 450 425" fill="none" stroke="#A9BBA5" stroke-width="65"/><path d="M450 425 A165 165 0 0 1 285 260" fill="none" stroke="#EAE3F0" stroke-width="65"/><path d="M285 260 A165 165 0 0 1 450 95" fill="none" stroke="#39243F" stroke-width="65"/><text x="450" y="250" font-size="32" font-weight="bold">Cycle</text><text x="450" y="290" font-size="20">length varies</text><text x="590" y="125" font-size="21">Follicular</text><text x="700" y="270" font-size="21">Ovulation</text><text x="450" y="485" font-size="21">Luteal</text><text x="190" y="270" font-size="21">Menstruation</text></g>
</svg>